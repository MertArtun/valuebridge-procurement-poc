[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "valuebridge-procurement-poc"
version = "0.1.0"
description = "Forward-deployed procurement exception workflow case study"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "jinja2>=3.1,<4.0",
  "pydantic>=2.10,<3.0",
  "pyyaml>=6.0,<7.0",
  "uvicorn[standard]>=0.34,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "ruff>=0.9,<1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
include = ["app*", "mockdesk*"]
exclude = ["tests*", "data*", "docs*", "evals*", "handoff*", "reports*", "runtime*", "scripts*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js"]
