services:
  mockdesk:
    build: .
    command: uvicorn mockdesk.main:app --host 0.0.0.0 --port 8001
    environment:
      MOCKDESK_DB_PATH: /app/runtime/mockdesk.db
    volumes:
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 3s
      timeout: 2s
      retries: 10

  valuebridge:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      MOCKDESK_URL: http://mockdesk:8001
      VALUEBRIDGE_DB_PATH: /app/runtime/valuebridge.db
    volumes:
      - ./runtime:/app/runtime
    ports:
      - "8000:8000"
    depends_on:
      mockdesk:
        condition: service_healthy
