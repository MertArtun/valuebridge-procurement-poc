name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Check browser script syntax
        run: node --check app/static/app.js

      - name: Test
        run: pytest -q

      - name: Verify project invariants
        run: python scripts/verify.py

      - name: Run evaluation cases
        run: python scripts/run_evals.py

      - name: Archive smoke check
        run: |
          mkdir -p "${RUNNER_TEMP}/archive-smoke"
          git archive --format=tar HEAD | tar -x -C "${RUNNER_TEMP}/archive-smoke"
          python -m venv "${RUNNER_TEMP}/archive-venv"
          cd "${RUNNER_TEMP}/archive-smoke"
          "${RUNNER_TEMP}/archive-venv/bin/python" -m pip install --quiet '.[dev]'
          "${RUNNER_TEMP}/archive-venv/bin/python" -m pytest -q -p no:cacheprovider
          "${RUNNER_TEMP}/archive-venv/bin/python" scripts/verify.py
          "${RUNNER_TEMP}/archive-venv/bin/python" scripts/run_evals.py

  docker-smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for ValueBridge
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - name: Run end-to-end demo assertions
        run: bash scripts/demo.sh

      - name: Run the demo again against the persistent volume
        run: bash scripts/demo.sh

      - name: Show service logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v
